name: Central Bank Drivers - Manual Test

on:
  workflow_dispatch:

jobs:
  update-central-bank-drivers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Run Central Bank updater
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CENTRAL_BANK_DRIVERS_WEBAPP_URL: ${{ secrets.CENTRAL_BANK_DRIVERS_WEBAPP_URL }}
        run: python central_bank_updater.py
